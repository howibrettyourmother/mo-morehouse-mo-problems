name: league-leaderboard
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    paths: ['scores/blocklist.json', 'scores/aggregate.py']
permissions:
  contents: write
concurrency:
  group: leaderboard
  cancel-in-progress: false
jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 scores/aggregate.py
      - name: commit if changed
        run: |
          if ! git diff --quiet scores/leaderboard.json; then
            git config user.name 'leaderboard-bot'
            git config user.email 'leaderboard-bot@users.noreply.github.com'
            git add scores/leaderboard.json
            git commit -m 'leaderboard update [skip ci]'
            git pull --rebase -q && git push -q
          fi
