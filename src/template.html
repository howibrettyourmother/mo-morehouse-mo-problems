function txt(s,x,y,sz,col,al,stroke,font){ctx.font=(font||'900 ')+sz+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';

function wrapTxt(s,x,y,sz,maxW,col,stroke){ctx.font='900 '+sz+'px '+FONT;const words=s.split(' ');let line='',lines=[];for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}lines.push(line);
  lines.forEach((l,i)=>txt(l,x,y+i*sz*1.2,sz,col,'center',stroke));return lines.length}
function goldGrad(y0,y1){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#fff6b0');g.addColorStop(0.35,'#ffd400');g.addColorStop(0.55,'#b8860b');g.addColorStop(0.75,'#ffe45c');g.addColorStop(1,'#a06a00');return g}
function shinyText(s,x,y,sz,maxW,t){ctx.save();ctx.font='900 '+sz+'px '+FONT;let w=ctx.measureText(s).width;if(w>maxW){sz*=maxW/w;ctx.font='900 '+sz+'px '+FONT;w=maxW}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=sz/4;ctx.strokeStyle='#2a0a00';ctx.strokeText(s,x,y+3);ctx.strokeText(s,x,y);

      if(!layer&&sr()<0.25){b.fillRect(x+bw/2-1,hz-bh-18,2,18)}

      x+=bw+1}}
  // water tower
  const wt=(x,y)=>{b.fillStyle='#1b0d14';b.fillRect(x-14,y-26,28,26);b.beginPath();b.moveTo(x-16,y-26);b.lineTo(x,y-38);b.lineTo(x+16,y-26);b.fill();b.strokeStyle='#1b0d14';b.lineWidth=2;
    b.beginPath();b.moveTo(x-12,y);b.lineTo(x-16,y+16);b.moveTo(x+12,y);b.lineTo(x+16,y+16);b.moveTo(x-14,y+8);b.lineTo(x+14,y+8);b.stroke();
    b.strokeStyle='rgba(255,255,255,.08)';b.lineWidth=1;for(let i=-10;i<14;i+=5){b.beginPath();b.moveTo(x+i,y-26);b.lineTo(x+i,y);b.stroke()}};
  wt(46,hz-20);wt(318,hz-6);
  // brownstone row
  const by=H*0.80;
  for(let i=0;i<5;i++){const x=i*74-8;b.fillStyle=['#5a2e22','#663628','#4f281e','#6e3b2b','#5c3024'][i];b.fillRect(x,by,72,H-by);
    b.fillStyle='#2c140e';b.fillRect(x-2,by-6,76,8);
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){const wx=x+8+c*21,wy=by+12+r*26;b.fillStyle='#1a0a06';b.fillRect(wx-1,wy-1,14,19);b.fillStyle=sr()<0.45?'#ffc864':'#2a1a2e';b.fillRect(wx,wy,12,17);b.fillStyle='#3a1c12';b.fillRect(wx-2,wy-4,16,3)}
    b.fillStyle='#3d2016';for(let s=0;s<5;s++)b.fillRect(x+44+s*2,H-14-s*6,22-s*4,6)}
  // rooftop ledge + graffiti wall
  const ly=H*0.885;b.fillStyle='#3b3540';b.fillRect(0,ly,W,H-ly);b.fillStyle='#2a252e';for(let x=0;x<W;x+=24){b.fillRect(x,ly,1,H-ly)}for(let y=ly+10;y<H;y+=10)b.fillRect(0,y,W,1);
  b.fillStyle='#57505c';b.fillRect(0,ly-4,W,5);
  const tag=(s,x,y,sz,col,rot,out)=>{b.save();b.translate(x,y);b.rotate(rot);b.font='900 '+sz+'px '+FONT;b.textAlign='center';b.textBaseline='middle';b.lineJoin='round';
    b.lineWidth=sz/3;b.strokeStyle='#000';b.strokeText(s,0,0);b.lineWidth=sz/7;b.strokeStyle=out;b.strokeText(s,0,0);b.fillStyle=col;b.fillText(s,0,0);b.restore()};
  const gy=ly+(H-ly)/2+2;
  tag('SHADYNASTY',62,gy,13,'#36e0ff','#ff2fa8',-0.06);tag('JOE=BROKE',182,gy+2,13,'#ff4040','#ffe600',0.04);tag('WEASELS',298,gy-2,13,'#7dff4a','#7b2cff',-0.03);
  tag('REBUILD 4EVA',300,by+62,9,'#ffe600','#ff2fa8',-0.12);tag('BK',24,by+44,14,'#ff9a2a','#2f6bff',0.15);tag('MO PROBLEMS',150,by+66,9,'#fff','#e3262e',0.06);
  // scanlines
  scanC=document.createElement('canvas');scanC.width=W;scanC.height=H;const s=scanC.getContext('2d');s.fillStyle='rgba(0,0,0,.22)';for(let y=0;y<H;y+=3)s.fillRect(0,y,W,1);
  const v=s.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');s.fillStyle=v;s.fillRect(0,0,W,H);
}

function drawBG(dt){ctx.drawImage(bgC,0,0,W,H);

function step(rdt){
  vhsT+=rdt;stateT+=rdt;
  if(slowT>0){slowT-=rdt;timeScale=slowT>0.3?0.22:0.22+(0.3-slowT)/0.3*0.78}else timeScale=1;
  const dt=rdt*timeScale;

  if(banner){banner.life-=rdt;if(banner.life<=0)banner=null}if(caption){caption.life-=rdt;if(caption.life<=0)caption=null}
  updParts(dt);
  if(state==='title'){if(R()<0.04)titleConf.push(1);return}
  if(state==='end'){return}

  gT+=dt;trackT+=dt;
  movePlayer(rdt);
  const p=player;p.inv=Math.max(0,p.inv-dt);p.spreadT=Math.max(0,p.spreadT-dt);p.rapidT=Math.max(0,p.rapidT-dt);p.shieldT=Math.max(0,p.shieldT-dt);
  // auto-fire footballs
  fireCD-=dt;if(fireCD<=0&&!p.dead&&state==='play'){fireCD=p.rapidT>0?0.11:0.22;const ang=p.spreadT>0?[-0.22,0,0.22]:[0];for(const a of ang)balls.push({x:p.x,y:p.y-30,vx:Math.sin(a)*520,vy:-Math.cos(a)*520,r:R()*6});AUD.SFX.throwF()}
  for(const b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=dt*14}balls=balls.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20&&!b.hit);
  // combo decay
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}meter=Math.max(0,meter-dt*2.5);
  // formation sway
  const sp=speed();formX+=formDir*22*sp*dt;if(formX>26){formX=26;formDir=-1}if(formX<-26){formX=-26;formDir=1}formY=Math.min(110,formY+dt*2.2*sp);
  for(const e of enemies){if(e.dead)continue;e.t+=dt;e.fl=Math.max(0,e.fl-dt);
    if(e.k==='pitts'){e.meter+=dt*38;if(e.meter>=99.4){e.meter=0;pop(e.x,e.y-30,'99%... RESET',RED,10)}}
    const tx=e.fx+formX,ty=e.fy+formY;
    if(e.enter){e.et+=dt;const u=clamp((e.et-e.edel)/1.3,0,1);if(u<=0){e.x=e.ex;e.y=e.ey}else{const s=u*u*(3-2*u);e.x=e.ex+(tx-e.ex)*s+Math.sin(u*Math.PI)*70*(e.ex<W/2?1:-1);e.y=e.ey+(ty-e.ey)*s}if(u>=1)e.enter=0;continue}
    if(e.mode==='rain'){const d=e.dv;d.t+=dt;e.y+=d.vy*dt;e.x+=clamp(p.x-e.x,-1,1)*d.home*dt;if(e.y>H+50){e.dead=1;continue}}
    else if(e.mode==='form'){e.x=tx;e.y=ty}
    else if(e.mode==='dive'){const d=e.dv;d.t+=dt;e.y+=d.vy*dt;e.x+=(clamp(p.x-e.x,-1,1)*d.home+Math.sin(d.t*d.wf)*d.wa)*dt;e.x=clamp(e.x,16,W-16);
      if(e.y>H+40){e.mode='return';e.y=-40;e.x=tx}}
    else if(e.mode==='return'){e.x+=(tx-e.x)*Math.min(1,dt*3);e.y+=(ty-e.y)*Math.min(1,dt*3);if(Math.abs(e.y-ty)<2)e.mode='form'}
    // Darnold throws INTs
    if(e.k==='darnold'||(trackI>=2&&e.k==='caleb')){e.shotT-=dt;if(e.shotT<=0&&e.y>0&&e.y<H*0.6){e.shotT=rnd(2.4,4.5)/sp;const a=Math.atan2(p.y-e.y,p.x-e.x);const v=150*Math.min(1.6,sp);
      eshots.push({x:e.x,y:e.y+14,vx:Math.cos(a)*v,vy:Math.sin(a)*v,k:e.k==='darnold'?'int':'sack',r:0});if(e.k==='darnold'){if(R()<0.35)AUD.heckle('INT');AUD.SFX.intThrow()}}}

    if(balloon&&balloon.x>W+120){balloon=null;pop(W-60,150,'THE REBUILD FLOATED AWAY... LIKE JOE\'S TITLE HOPES',RED,10)}}

  if(amb){amb.t+=rdt;amb.x+=150*rdt;if(amb.x>W+100)amb=null}
  for(const pt of potties)pt.t+=dt;potties=potties.filter(pt=>pt.t<2.2);

}
function movePlayer(dt){const p=player;if(!p)return;const k=keys,v=300*dt;if(k.ArrowLeft||k.a)p.x-=v;if(k.ArrowRight||k.d)p.x+=v;if(k.ArrowUp||k.w)p.y-=v;if(k.ArrowDown||k.s)p.y+=v;p.x=clamp(p.x,18,W-18);p.y=clamp(p.y,H*0.45,H-44);p.bob+=dt}

function updBoss(dt,p){const b=boss;b.t+=dt;b.fl=Math.max(0,b.fl-dt);

  if(navigator.share){navigator.share({title:'MOREHOUSE MORE PROBLEMS',text,url:SHARE_URL}).then(()=>shareLabel('\u2705 SHARED! MO PROBLEMS'),err=>{if(err&&err.name==='AbortError')return;copyShare(lastShare)})}
  else copyShare(lastShare)});
againBtn.addEventListener('click',e=>{e.stopPropagation();AUD.unlock();if(state==='end')startGame()});
function showHS(){hsEntering=true;let v='';try{v=localStorage.getItem('nw_ini')||''}catch(e){}hsIn.value=cleanIni(v);hsPanel.style.display='block';updateOverlays();if(!isTouch)setTimeout(()=>{try{hsIn.focus();hsIn.select()}catch(e){}},60)}
function saveHS(){if(!hsEntering)return;lbSubmit(hsIn.value);hsEntering=false;hsPanel.style.display='none';try{hsIn.blur()}catch(e){}AUD.SFX.cheer(1);window.scrollTo(0,0);updateOverlays()}
hsIn.addEventListener('input',()=>{const c=cleanIni(hsIn.value);if(c!==hsIn.value)hsIn.value=c});
hsIn.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();saveHS()}});
hsIn.addEventListener('blur',()=>setTimeout(()=>window.scrollTo(0,0),50));
document.getElementById('hsOk').addEventListener('click',e=>{e.stopPropagation();AUD.unlock();saveHS()});
hsPanel.addEventListener('pointerdown',e=>e.stopPropagation());
// ---------- main loop ----------
let lastT=performance.now(),frames=0;
function frame(n){const dt=Math.min(0.05,Math.max(0,(n-lastT)/1000));lastT=n;frames++;if(!document.hidden){try{step(dt)}catch(e){console.error(e)}}updateOverlays();try{draw()}catch(e){console.error(e)}requestAnimationFrame(frame)}
player=newPlayer();layout();requestAnimationFrame(frame);
if(DEBUG){window.__NW={get state(){return state},get score(){return score},get problems(){return problems},get lives(){return lives},set lives(v){lives=v},get combo(){return combo},get meter(){return meter},set meter(v){meter=v},
  get trackI(){return trackI},get loop(){return loop},get finT(){return finT},get timeScale(){return timeScale},get hsEntering(){return hsEntering},get lastShare(){return lastShare},get frames(){return frames},audio:AUD,lb:lbLoad,
  get player(){return{x:player.x,y:player.y,inv:player.inv,spreadT:player.spreadT,rapidT:player.rapidT,shieldT:player.shieldT}},get balls(){return balls.length},get boss(){return boss&&{hp:boss.hp,max:boss.max,dead:boss.dead,x:boss.x,y:boss.y}},
  get balloon(){return balloon&&{hp:balloon.hp,x:balloon.x}},get potCount(){return potCount},get finishers(){return finishers},get parts(){return parts.length},get tp(){return parts.filter(q=>q.tp===1).length},
  enemies:()=>enemies.map(e=>({k:e.k,x:e.x,y:e.y,hp:e.hp,mode:e.mode,enter:e.enter})),
  clientOf(x,y){const r=cv.getBoundingClientRect();return{x:r.left+x/W*r.width,y:r.top+y/H*r.height}},
  spawn(k,x,y){const e=mkEnemy(k,x,y);e.x=x;e.y=y;enemies.push(e);return enemies.length},clearAll(){enemies=[];eshots=[];stars=[];balloon=null},hold(){trackCleared=true;starT=1e9;diveT=1e9},
  star(type,x,y){spawnStar(type,x,y)},shot(k,x,y){eshots.push({x,y,vx:0,vy:120,k,r:0})},bossGo(){enemies=[];trackI=4;spawnBoss();boss.y=boss.ty},setBossHp(v){boss.hp=v},balloonGo(x){spawnBalloon();balloon.x=x||W/2},
  track(i){startTrack(i)},end(){endGame('FINAL WHISTLE')},fin(){fireSale()},get firesales(){return firesales},get finMode(){return finMode},noInv(){player.inv=0;player.shieldT=0},get bossPhase(){return boss&&boss.phase},get bossTaunt(){return boss&&boss.taunt},get rain(){return rainN},get waahN(){return waahN},get amb(){return !!amb},waah(){lastWaah=-1e9;waahmbulance()},movePlayer(x,y){player.x=x;player.y=y},freezeEnemies(){for(const e of enemies){e.enter=0;e.mode='frozen'}}};
