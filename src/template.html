<script>
"use strict";
/*__AUDIO__*/
// ====================================================================================
// MOREHOUSE MORE PROBLEMS - vertical shooter. You are Joe. The Weasels are the best team in the league.
// ====================================================================================
const DEBUG=/[?&]debug=1\b/.test(location.search);
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const PHOTO=new Image();PHOTO.src='data:image/jpeg;base64,__PHOTO__';
const FACE=new Image();FACE.src='data:image/png;base64,__FACE__';
const isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const W=360;let H=640,S=1,DPR=1;
const FONT='"Arial Black",Impact,"Helvetica Neue",Arial,sans-serif';
const R=Math.random,rnd=(a,b)=>a+R()*(b-a),pick=a=>a[(R()*a.length)|0],clamp=(v,a,b)=>v<a?a:v>b?b:v;
const RED='#e3262e',GOLD='#ffd400';
// LOW-POWER MODE: if frames run >20ms for ~1.5s, cut particles/confetti, glow and DPR (sticky for the session)
let lowPower=/[?&]lowpower=1\b/.test(location.search),ftEMA=16,slowAcc=0;
// ---------- layout ----------
let bgC=null,scanC=null;
// iOS home-screen (standalone) mode runs edge-to-edge under the status bar/notch and home indicator. We read the insets via the probe
// and lay the whole game out inside the safe box: canvas, HUD, top buttons and every hit area move together (input maps via the canvas rect).
// The strip under the status bar is painted in the HUD bar color. Normal Safari reports 0 insets -> layout is identical to before.
let SA={t:0,r:0,b:0,l:0};
function readSafe(){try{const cs=getComputedStyle(document.getElementById('safeProbe'));const f=v=>Math.max(0,Math.round(parseFloat(v)||0));return{t:f(cs.paddingTop),r:f(cs.paddingRight),b:f(cs.paddingBottom),l:f(cs.paddingLeft)}}catch(e){return{t:0,r:0,b:0,l:0}}}
function layout(){
  SA=readSafe();const app=document.getElementById('app');app.style.padding=SA.t+'px '+SA.r+'px '+SA.b+'px '+SA.l+'px';
  document.body.style.background=SA.t>0?'linear-gradient(#0a0314 '+SA.t+'px,#12061f '+SA.t+'px)':'';
  const vw=window.innerWidth-SA.l-SA.r,vh=window.innerHeight-SA.t-SA.b;
  H=Math.round(clamp(W*vh/vw,580,780));
  S=Math.min(vw/W,vh/H);DPR=Math.min(window.devicePixelRatio||1,lowPower?1.5:2);
  cv.width=Math.round(W*S*DPR);cv.height=Math.round(H*S*DPR);cv.style.width=Math.round(W*S)+'px';cv.style.height=Math.round(H*S)+'px';
  // top buttons scale with the canvas on small screens so they never cover SEASONS LEFT (iPhone 13 and larger: unchanged 36px)
  {const k=Math.min(1,S),bs=Math.max(28,Math.round(36*k)),g=Math.round(6*k);for(const[id,i]of[['muteBtn',0],['musicBtn',1]]){const el=document.getElementById(id);if(el)el.style.cssText+=`;width:${bs}px;height:${bs}px;line-height:${bs-4}px;top:${g}px;right:${g+i*(bs+g)}px;font-size:${Math.round(16*k)}px`}}
  buildBG();placeButtons();
  if(player){player.y=clamp(player.y,H*0.5,H-60)}
}
window.addEventListener('resize',layout);window.addEventListener('orientationchange',()=>setTimeout(layout,200));
// ---------- text helpers ----------
function txt(s,x,y,sz,col,al,stroke,font){ctx.font=(font||'900 ')+sz+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=Math.max(2,sz/5);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}
function fit(s,x,y,sz,maxW,col,stroke,al){ctx.font='900 '+sz+'px '+FONT;const w=ctx.measureText(s).width;if(w>maxW)sz=sz*maxW/w;txt(s,x,y,sz,col,al||'center',stroke)}
function wrapTxt(s,x,y,sz,maxW,col,stroke){ctx.font='900 '+sz+'px '+FONT;const words=s.split(' ');let line='',lines=[];for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}lines.push(line);
  lines.forEach((l,i)=>txt(l,x,y+i*sz*1.2,sz,col,'center',stroke));return lines.length}
function goldGrad(y0,y1){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,'#fff6b0');g.addColorStop(0.35,'#ffd400');g.addColorStop(0.55,'#b8860b');g.addColorStop(0.75,'#ffe45c');g.addColorStop(1,'#a06a00');return g}
function shinyText(s,x,y,sz,maxW,t){ctx.save();ctx.font='900 '+sz+'px '+FONT;let w=ctx.measureText(s).width;if(w>maxW){sz*=maxW/w;ctx.font='900 '+sz+'px '+FONT;w=maxW}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=sz/4;ctx.strokeStyle='#2a0a00';ctx.strokeText(s,x,y+3);ctx.strokeText(s,x,y);
  ctx.fillStyle=goldGrad(y-sz/2,y+sz/2);ctx.fillText(s,x,y);
  // shiny-suit sweep
  ctx.globalCompositeOperation='source-atop';const sx=x-w/2+((t*160)%(w+200))-100;const g=ctx.createLinearGradient(sx-30,0,sx+30,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=g;ctx.fillText(s,x,y);ctx.restore()}
function rr4(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
// ---------- backdrop: Brooklyn rooftop at night, brownstones, graffiti ----------
function buildBG(){
  bgC=document.createElement('canvas');bgC.width=W*2;bgC.height=H*2;const b=bgC.getContext('2d');b.scale(2,2);
  let g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0420');g.addColorStop(0.45,'#2b0b45');g.addColorStop(0.72,'#7a1f4f');g.addColorStop(0.86,'#d9573a');g.addColorStop(1,'#2a0f1a');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  let sd=7;const sr=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};
  for(let i=0;i<70;i++){b.fillStyle=`rgba(255,255,255,${0.2+sr()*0.6})`;b.fillRect(sr()*W,sr()*H*0.5,1.2,1.2)}
  b.fillStyle='#fff3c4';b.beginPath();b.arc(290,90,22,0,7);b.fill();b.fillStyle='rgba(255,240,180,.12)';b.beginPath();b.arc(290,90,40,0,7);b.fill();
  // far skyline
  const hz=H*0.70;
  for(let layer=0;layer<2;layer++){let x=-5;while(x<W){const bw=18+sr()*34,bh=(layer?40:70)+sr()*(layer?70:120);b.fillStyle=layer?'#24102e':'#170a24';b.fillRect(x,hz-bh+layer*20,bw,bh+80);
      if(!layer&&sr()<0.25){b.fillRect(x+bw/2-1,hz-bh-18,2,18)}
      for(let wy=hz-bh+layer*20+6;wy<hz+20;wy+=8)for(let wx=x+3;wx<x+bw-4;wx+=6)if(sr()<0.22){b.fillStyle=sr()<0.8?'rgba(255,214,120,.75)':'rgba(140,220,255,.7)';b.fillRect(wx,wy,3,4)}
      x+=bw+1}}
  // water tower
  const wt=(x,y)=>{b.fillStyle='#1b0d14';b.fillRect(x-14,y-26,28,26);b.beginPath();b.moveTo(x-16,y-26);b.lineTo(x,y-38);b.lineTo(x+16,y-26);b.fill();b.strokeStyle='#1b0d14';b.lineWidth=2;
    b.beginPath();b.moveTo(x-12,y);b.lineTo(x-16,y+16);b.moveTo(x+12,y);b.lineTo(x+16,y+16);b.moveTo(x-14,y+8);b.lineTo(x+14,y+8);b.stroke();
    b.strokeStyle='rgba(255,255,255,.08)';b.lineWidth=1;for(let i=-10;i<14;i+=5){b.beginPath();b.moveTo(x+i,y-26);b.lineTo(x+i,y);b.stroke()}};
  wt(46,hz-20);wt(318,hz-6);
  // brownstone row
  const by=H*0.80;
  for(let i=0;i<5;i++){const x=i*74-8;b.fillStyle=['#5a2e22','#663628','#4f281e','#6e3b2b','#5c3024'][i];b.fillRect(x,by,72,H-by);
    b.fillStyle='#2c140e';b.fillRect(x-2,by-6,76,8);
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){const wx=x+8+c*21,wy=by+12+r*26;b.fillStyle='#1a0a06';b.fillRect(wx-1,wy-1,14,19);b.fillStyle=sr()<0.45?'#ffc864':'#2a1a2e';b.fillRect(wx,wy,12,17);b.fillStyle='#3a1c12';b.fillRect(wx-2,wy-4,16,3)}
    b.fillStyle='#3d2016';for(let s=0;s<5;s++)b.fillRect(x+44+s*2,H-14-s*6,22-s*4,6)}
  // rooftop ledge + graffiti wall
  const ly=H*0.885;b.fillStyle='#3b3540';b.fillRect(0,ly,W,H-ly);b.fillStyle='#2a252e';for(let x=0;x<W;x+=24){b.fillRect(x,ly,1,H-ly)}for(let y=ly+10;y<H;y+=10)b.fillRect(0,y,W,1);
  b.fillStyle='#57505c';b.fillRect(0,ly-4,W,5);
  const tag=(s,x,y,sz,col,rot,out)=>{b.save();b.translate(x,y);b.rotate(rot);b.font='900 '+sz+'px '+FONT;b.textAlign='center';b.textBaseline='middle';b.lineJoin='round';
    b.lineWidth=sz/3;b.strokeStyle='#000';b.strokeText(s,0,0);b.lineWidth=sz/7;b.strokeStyle=out;b.strokeText(s,0,0);b.fillStyle=col;b.fillText(s,0,0);b.restore()};
  const gy=ly+(H-ly)/2+2;
  tag('SHADYNASTY',62,gy,13,'#36e0ff','#ff2fa8',-0.06);tag('JOE=BROKE',182,gy+2,13,'#ff4040','#ffe600',0.04);tag('WEASELS',298,gy-2,13,'#7dff4a','#7b2cff',-0.03);
  tag('REBUILD 4EVA',300,by+62,9,'#ffe600','#ff2fa8',-0.12);tag('BK',24,by+44,14,'#ff9a2a','#2f6bff',0.15);tag('MO PROBLEMS',150,by+66,9,'#fff','#e3262e',0.06);
  // scanlines
  scanC=document.createElement('canvas');scanC.width=W;scanC.height=H;const s=scanC.getContext('2d');s.fillStyle='rgba(0,0,0,.22)';for(let y=0;y<H;y+=3)s.fillRect(0,y,W,1);
  const v=s.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');s.fillStyle=v;s.fillRect(0,0,W,H);
}
let bgLights=[];for(let i=0;i<26;i++)bgLights.push({x:R()*W,y:R()*800,s:rnd(0.6,2),v:rnd(18,60),c:pick(['#ffd400','#ff2fa8','#36e0ff','#fff'])});
function drawBG(dt){ctx.drawImage(bgC,0,0,W,H);
  for(const l of bgLights){l.y+=l.v*dt;if(l.y>H*0.8){l.y=-5;l.x=R()*W}ctx.globalAlpha=0.35;ctx.fillStyle=l.c;ctx.fillRect(l.x,l.y,l.s,l.s*5);ctx.globalAlpha=1}}
let vhsT=0;
function drawVHS(){ctx.drawImage(scanC,0,0,W,H);
  const ty=((vhsT*60)%(H+80))-40;ctx.fillStyle='rgba(255,255,255,.05)';ctx.fillRect(0,ty,W,14);ctx.fillStyle='rgba(255,0,120,.04)';ctx.fillRect(0,ty+14,W,4);

function vhsOSD(x,y,label){const blink=((vhsT*2)|0)%2;ctx.save();ctx.globalAlpha=0.85;txt('\u25B6 '+label,x,y,11,'#fff','left','rgba(0,0,0,.6)','700 ');
  const t=Math.floor(vhsT),m=Math.floor(t/60),s=t%60;txt('SP 0:'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'),x,y+14,10,'#fff','left','rgba(0,0,0,.6)','700 ');
  if(blink){ctx.fillStyle='#f22';ctx.beginPath();ctx.arc(x+4,y+28,3,0,7);ctx.fill();txt('REC',x+11,y+28,9,'#fff','left',null,'700 ')}ctx.restore()}
