// ---------- text helpers ----------
function txt(s,x,y,sz,col,al,stroke,font){ctx.font=(font||'900 ')+sz+'px '+FONT;ctx.textAlign=al||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=Math.max(2,sz/5);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y)}ctx.fillStyle=col;ctx.fillText(s,x,y)}

function wrapTxt(s,x,y,sz,maxW,col,stroke){ctx.font='900 '+sz+'px '+FONT;const words=s.split(' ');let line='',lines=[];for(const w of words){const t=line?line+' '+w:w;if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=w}else line=t}lines.push(line);
  lines.forEach((l,i)=>txt(l,x,y+i*sz*1.2,sz,col,'center',stroke));return lines.length}

function shinyText(s,x,y,sz,maxW,t){ctx.save();ctx.font='900 '+sz+'px '+FONT;let w=ctx.measureText(s).width;if(w>maxW){sz*=maxW/w;ctx.font='900 '+sz+'px '+FONT;w=maxW}
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=sz/4;ctx.strokeStyle='#2a0a00';ctx.strokeText(s,x,y+3);ctx.strokeText(s,x,y);
  ctx.fillStyle=goldGrad(y-sz/2,y+sz/2);ctx.fillText(s,x,y);
  // shiny-suit sweep
  ctx.globalCompositeOperation='source-atop';const sx=x-w/2+((t*160)%(w+200))-100;const g=ctx.createLinearGradient(sx-30,0,sx+30,0);g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(0.5,'rgba(255,255,255,.85)');g.addColorStop(1,'rgba(255,255,255,0)');

// ---------- backdrop: Brooklyn rooftop at night, brownstones, graffiti ----------
function buildBG(){
  bgC=document.createElement('canvas');bgC.width=W*2;bgC.height=H*2;const b=bgC.getContext('2d');b.scale(2,2);
  let g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b0420');g.addColorStop(0.45,'#2b0b45');g.addColorStop(0.72,'#7a1f4f');g.addColorStop(0.86,'#d9573a');g.addColorStop(1,'#2a0f1a');

  let sd=7;const sr=()=>{sd=(sd*16807)%2147483647;return sd/2147483647};

  b.fillStyle='#fff3c4';b.beginPath();b.arc(290,90,22,0,7);b.fill();b.fillStyle='rgba(255,240,180,.12)';b.beginPath();b.arc(290,90,40,0,7);b.fill();

      if(!layer&&sr()<0.25){b.fillRect(x+bw/2-1,hz-bh-18,2,18)}
      for(let wy=hz-bh+layer*20+6;wy<hz+20;wy+=8)for(let wx=x+3;wx<x+bw-4;wx+=6)if(sr()<0.22){b.fillStyle=sr()<0.8?'rgba(255,214,120,.75)':'rgba(140,220,255,.7)';b.fillRect(wx,wy,3,4)}
      x+=bw+1}}
  // water tower
  const wt=(x,y)=>{b.fillStyle='#1b0d14';b.fillRect(x-14,y-26,28,26);b.beginPath();b.moveTo(x-16,y-26);b.lineTo(x,y-38);b.lineTo(x+16,y-26);b.fill();b.strokeStyle='#1b0d14';b.lineWidth=2;
    b.beginPath();b.moveTo(x-12,y);b.lineTo(x-16,y+16);b.moveTo(x+12,y);b.lineTo(x+16,y+16);b.moveTo(x-14,y+8);b.lineTo(x+14,y+8);b.stroke();
    b.strokeStyle='rgba(255,255,255,.08)';b.lineWidth=1;for(let i=-10;i<14;i+=5){b.beginPath();b.moveTo(x+i,y-26);b.lineTo(x+i,y);b.stroke()}};
  wt(46,hz-20);wt(318,hz-6);
  // brownstone row
  const by=H*0.80;
  for(let i=0;i<5;i++){const x=i*74-8;b.fillStyle=['#5a2e22','#663628','#4f281e','#6e3b2b','#5c3024'][i];b.fillRect(x,by,72,H-by);
    b.fillStyle='#2c140e';b.fillRect(x-2,by-6,76,8);
    for(let r=0;r<3;r++)for(let c=0;c<3;c++){const wx=x+8+c*21,wy=by+12+r*26;b.fillStyle='#1a0a06';b.fillRect(wx-1,wy-1,14,19);b.fillStyle=sr()<0.45?'#ffc864':'#2a1a2e';b.fillRect(wx,wy,12,17);b.fillStyle='#3a1c12';b.fillRect(wx-2,wy-4,16,3)}
    b.fillStyle='#3d2016';for(let s=0;s<5;s++)b.fillRect(x+44+s*2,H-14-s*6,22-s*4,6)}
  // rooftop ledge + graffiti wall
  const ly=H*0.885;b.fillStyle='#3b3540';b.fillRect(0,ly,W,H-ly);b.fillStyle='#2a252e';for(let x=0;x<W;x+=24){b.fillRect(x,ly,1,H-ly)}for(let y=ly+10;y<H;y+=10)b.fillRect(0,y,W,1);
  b.fillStyle='#57505c';b.fillRect(0,ly-4,W,5);
  const tag=(s,x,y,sz,col,rot,out)=>{b.save();b.translate(x,y);b.rotate(rot);b.font='900 '+sz+'px '+FONT;b.textAlign='center';b.textBaseline='middle';b.lineJoin='round';
    b.lineWidth=sz/3;b.strokeStyle='#000';b.strokeText(s,0,0);b.lineWidth=sz/7;b.strokeStyle=out;b.strokeText(s,0,0);b.fillStyle=col;b.fillText(s,0,0);b.restore()};
  const gy=ly+(H-ly)/2+2;
  tag('SHADYNASTY',62,gy,13,'#36e0ff','#ff2fa8',-0.06);tag('JOE=BROKE',182,gy+2,13,'#ff4040','#ffe600',0.04);tag('WEASELS',298,gy-2,13,'#7dff4a','#7b2cff',-0.03);
  tag('REBUILD 4EVA',300,by+62,9,'#ffe600','#ff2fa8',-0.12);tag('BK',24,by+44,14,'#ff9a2a','#2f6bff',0.15);tag('MO PROBLEMS',150,by+66,9,'#fff','#e3262e',0.06);
  // scanlines
  scanC=document.createElement('canvas');scanC.width=W;scanC.height=H;const s=scanC.getContext('2d');s.fillStyle='rgba(0,0,0,.22)';for(let y=0;y<H;y+=3)s.fillRect(0,y,W,1);
  const v=s.createRadialGradient(W/2,H/2,H*0.3,W/2,H/2,H*0.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');s.fillStyle=v;s.fillRect(0,0,W,H);
}
let bgLights=[];for(let i=0;i<26;i++)bgLights.push({x:R()*W,y:R()*800,s:rnd(0.6,2),v:rnd(18,60),c:pick(['#ffd400','#ff2fa8','#36e0ff','#fff'])});
function drawBG(dt){ctx.drawImage(bgC,0,0,W,H);
  for(const l of bgLights){l.y+=l.v*dt;if(l.y>H*0.8){l.y=-5;l.x=R()*W}ctx.globalAlpha=0.35;ctx.fillStyle=l.c;ctx.fillRect(l.x,l.y,l.s,l.s*5);ctx.globalAlpha=1}}

function drawVHS(){ctx.drawImage(scanC,0,0,W,H);

function startTrack(i){trackI=i;trackT=0;trackCleared=false;const tr=TRACKS[i];enemies=[];eshots=[];formX=0;formY=0;formDir=1;diveT=2.8;
  showBanner((tr.n+': '+tr.t).toUpperCase(),tr.boss?RED:GOLD,true);AUD.sting(loop&&i===0?'a_remix':tr.k,{quiet:true});
  if(loop&&i===0)setTimeout(()=>{if(state==='play')showBanner('THE REMIX! FASTER!',RED,true)},1700);
  AUD.setTheme(tr.boss?'boss':'main');
  if(tr.boss){spawnBoss();return}
  const rows=tr.rows,cols=5,sx=W/2-(cols-1)*31;
  rows.forEach((row,r)=>row.forEach((k,c)=>{const e=mkEnemy(k,sx+c*62,96+r*52);e.enter=1;e.ex=rnd(-40,W+40);e.ey=-60-r*30-c*14;e.edel=r*0.35+c*0.09;enemies.push(e)}));
  if(tr.balloon)setTimeout(()=>{if(state==='play'&&trackI===i)spawnBalloon()},5000);
}
function mkEnemy(k,fx,fy){const d=KIND[k];return{k,d,fx,fy,x:fx,y:-60,hp:d.hp+(loop&&d.hp>1?1:0),max:d.hp+(loop&&d.hp>1?1:0),fl:0,t:R()*6,mode:'form',enter:0,ex:0,ey:0,edel:0,et:0,shotT:rnd(2,5),flipped:0,meter:R()*80,dv:null}}
function speed(){return 1+loop*0.35+trackI*0.06}
function spawnBoss(){const hp=70+loop*40;boss={x:W/2,y:-140,ty:150,hp,max:hp,t:0,fl:0,shotT:2,snot:0,dir:1,cry:0,dead:0};AUD.SFX.bossSting();setTimeout(()=>AUD.heckle('BOSS',true),1600)}
function spawnBalloon(){balloon={x:-80,y:140,hp:14+loop*6,max:14+loop*6,t:0,sc:1,fl:0};AUD.heckle('BALLOON',true);showBanner('GIANT REBUILD YEAR 5 BALLOON!',RED)}
function spawnStar(type,x,y){type=type||pick(['spread','spread','rapid','rapid','shield','life']);if(type==='life'&&lives>=5)type='rapid';stars.push({type,x:x==null?rnd(30,W-30):x,y:y==null?-20:y,t:R()*6,vy:rnd(60,80)})}
// ---------- start / end ----------
function startGame(){resetRun();hsEntering=false;hsPanel.style.display='none';go('intro');AUD.SFX.scratch();AUD.sting('a_go',{quiet:true});showBanner('READY TO REBUILD? HELL NO!',GOLD,true);AUD.setTheme('main');updateOverlays()}
function endGame(why){if(state==='end')return;endReason=why||'';roast=pick(ROASTS);if(score>hi){hi=score;try{localStorage.setItem('nw_hi',hi)}catch(e){}}
  go('end');timeScale=1;slowT=0;AUD.SFX.trombone();AUD.endingDelay(2.2);AUD.setTheme('ending');AUD.sting('a_over',{quiet:true,delay:0.3});setTimeout(()=>{if(state==='end')AUD.heckle('end',true)},3600);
  burst(W/2,H*0.3,60,8);if(lbQualifies(score))setTimeout(()=>{if(state==='end')showHS()},1300);updateOverlays()}
// ---------- combat ----------
function addCombo(n){combo++;comboT=2.6;if(combo>comboBest)comboBest=combo;meter=Math.min(100,meter+n);if(meter>=100&&finT<=0)finisher()}
function killEnemy(e,quiet){e.dead=1;problems++;const mult=1+Math.min(4,Math.floor(combo/10));const pts=e.d.pts*mult;score+=pts;hits++;
  burst(e.x,e.y,e.d.big?26:14,e.d.big?4:1);AUD.SFX.splat(e.d.big);pop(e.x,e.y-16,'+'+pts,GOLD,13);
  const w=pick(e.d.word);pop(e.x,e.y-34,w,e.d.big?RED:'#fff',e.d.big?15:12);
  if(e.k==='caleb'){potties.push({x:e.x,y:e.y,t:0});potCount++;AUD.SFX.flush();if(!quiet){AUD.sting('a_potty',{quiet:true,throttle:9000})||AUD.heckle('CALEB',true)}burst(e.x,e.y,0,6)}
  else if(!quiet&&R()<0.5)AUD.heckle(e.d.grp);
  if(e.d.big)airhorn();
  if(R()<0.07)spawnStar(null,e.x,e.y);
  addCombo(e.d.big?11:6);
  if(problems%50===0){AUD.sting('a_mmp',{quiet:true});showBanner(problems+' PROBLEMS! MO MOREHOUSE, MO PROBLEMS!',GOLD,true);AUD.SFX.mmpChant()}
}
function hurtPlayer(src){if(player.inv>0||state!=='play')return;
  if(player.shieldT>0){player.shieldT=0;player.inv=1;AUD.SFX.ghostEat();pop(player.x,player.y-40,'COOGI ARMOR SAVED YOU!',GOLD,13);return}
  lives--;player.inv=2.2;combo=0;meter=Math.max(0,meter-40);shake=10;flash=1;flashCol='#f00';AUD.SFX.hurt();AUD.SFX.boo(0.8);
  pop(player.x,player.y-44,src||'OUCH!',RED,15);const n=performance.now();if(n-lastHurtHk>3000){lastHurtHk=n;AUD.heckle('HURT',true)}
  if(lives<=0){AUD.SFX.death();setTimeout(()=>endGame('JOE\'S RED SHIT TOOK YOUR LAST CHAIN'),900);player.dead=1}}
function finisher(){finT=2.2;slowT=1.8;meter=0;finishers++;shake=16;flash=1;flashCol='#fff';AUD.SFX.slowmo();AUD.SFX.scratch();AUD.sting('a_eatshit',{quiet:true,rate:0.78});airhorn();setTimeout(()=>airhorn(),450);
  AUD.SFX.eatShitChant(0.2);AUD.SFX.cheer(1.4);
  for(const e of enemies)if(!e.dead&&e.y>-20){killEnemy(e,true)}

  if(balloon){balloon.hp=0;popBalloon()}

function popBalloon(){if(!balloon)return;const b=balloon;score+=2500;problems++;burst(b.x,b.y,90,16);AUD.SFX.bigPop();airhorn();setTimeout(()=>airhorn(),300);AUD.heckle('BALLOONPOP',true);
  pop(b.x,b.y,'+2500 REBUILD POPPED!',GOLD,17);shake=12;balloon=null;addCombo(20);spawnStar(null,b.x,b.y)}
function killBoss(){if(!boss||boss.dead)return;boss.dead=1;bossesBeat++;problems++;score+=10000*(loop+1);finT=Math.max(finT,2.4);slowT=2;shake=20;flash=1;flashCol='#fff';
  AUD.SFX.slowmo();AUD.sting('a_eatshit',{quiet:true,rate:0.78});airhorn();setTimeout(()=>airhorn(),500);setTimeout(()=>AUD.heckle('BOSSDIE',true),2200);AUD.SFX.cheer(1.6);AUD.SFX.eatShitChant(0.25);
  burst(boss.x,boss.y,140,24);pop(boss.x,boss.y-60,'+'+(10000*(loop+1))+' GM FIRED!',GOLD,20);eshots=[];
  setTimeout(()=>{if(state==='play'){boss=null;loop++;startTrack(0)}},3600)}
// ---------- input: drag anywhere to move (relative), auto-fire ----------
function cpos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H}}
cv.addEventListener('pointerdown',e=>{e.preventDefault();const p=cpos(e);
  if(state==='title'){if(!soundAsked){soundAsked=true;AUD.SFX.airhorn();AUD.setTheme('title');burst(W/2,H*0.4,40,4);return}startGame();return}
  if(state==='end')return;
  if(player)ptr={id:e.pointerId,ox:player.x-p.x,oy:player.y-p.y};try{cv.setPointerCapture(e.pointerId)}catch(err){}},{passive:false});
cv.addEventListener('pointermove',e=>{if(!ptr||e.pointerId!==ptr.id||!player)return;const p=cpos(e);player.x=clamp(p.x+ptr.ox,18,W-18);player.y=clamp(p.y+ptr.oy,H*0.45,H-44)});
const endPtr=e=>{if(ptr&&e.pointerId===ptr.id)ptr=null};cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
['touchstart','touchmove','touchend','gesturestart','dblclick'].forEach(ev=>document.addEventListener(ev,e=>{if(e.target===hsIn||e.target.closest&&e.target.closest('button'))return;e.preventDefault()},{passive:false}));
const keys={};window.addEventListener('keydown',e=>{if(e.target===hsIn)return;keys[e.key]=1;
  if(e.key==='m'||e.key==='M'){muteBtn.click()}else if(e.key==='n'||e.key==='N'){musicBtn.click()}
  else if((e.key===' '||e.key==='Enter')&&state==='title'){if(!soundAsked){soundAsked=true;AUD.SFX.airhorn();AUD.setTheme('title');return}startGame()}
  else if((e.key===' '||e.key==='Enter')&&state==='end'&&!hsEntering&&stateT>1.5)startGame();
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown',' '].includes(e.key))e.preventDefault()});
window.addEventListener('keyup',e=>{keys[e.key]=0});
// ---------- update ----------
function step(rdt){
  vhsT+=rdt;stateT+=rdt;
  if(slowT>0){slowT-=rdt;timeScale=slowT>0.3?0.22:0.22+(0.3-slowT)/0.3*0.78}else timeScale=1;
  const dt=rdt*timeScale;
  if(finT>0)finT-=rdt;if(shake>0)shake=Math.max(0,shake-rdt*30);if(flash>0)flash=Math.max(0,flash-rdt*2.5);
  if(banner){banner.life-=rdt;if(banner.life<=0)banner=null}if(caption){caption.life-=rdt;if(caption.life<=0)caption=null}
  updParts(dt);
  if(state==='title'){if(R()<0.04)titleConf.push(1);return}
  if(state==='end'){return}
  if(state==='intro'){if(stateT>1.6){go('play');startTrack(0)}movePlayer(rdt);return}
  gT+=dt;trackT+=dt;
  movePlayer(rdt);
  const p=player;p.inv=Math.max(0,p.inv-dt);p.spreadT=Math.max(0,p.spreadT-dt);p.rapidT=Math.max(0,p.rapidT-dt);p.shieldT=Math.max(0,p.shieldT-dt);
  // auto-fire footballs
  fireCD-=dt;if(fireCD<=0&&!p.dead){fireCD=p.rapidT>0?0.11:0.22;const ang=p.spreadT>0?[-0.22,0,0.22]:[0];for(const a of ang)balls.push({x:p.x,y:p.y-30,vx:Math.sin(a)*520,vy:-Math.cos(a)*520,r:R()*6});AUD.SFX.throwF()}
  for(const b of balls){b.x+=b.vx*dt;b.y+=b.vy*dt;b.r+=dt*14}balls=balls.filter(b=>b.y>-20&&b.x>-20&&b.x<W+20&&!b.hit);
  // combo decay
  if(comboT>0){comboT-=dt;if(comboT<=0)combo=0}meter=Math.max(0,meter-dt*2.5);
  // formation sway
  const sp=speed();formX+=formDir*22*sp*dt;if(formX>26){formX=26;formDir=-1}if(formX<-26){formX=-26;formDir=1}formY=Math.min(110,formY+dt*2.2*sp);
  for(const e of enemies){if(e.dead)continue;e.t+=dt;e.fl=Math.max(0,e.fl-dt);
    if(e.k==='pitts'){e.meter+=dt*38;if(e.meter>=99.4){e.meter=0;pop(e.x,e.y-30,'99%... RESET',RED,10)}}
    const tx=e.fx+formX,ty=e.fy+formY;
    if(e.enter){e.et+=dt;const u=clamp((e.et-e.edel)/1.3,0,1);if(u<=0){e.x=e.ex;e.y=e.ey}else{const s=u*u*(3-2*u);e.x=e.ex+(tx-e.ex)*s+Math.sin(u*Math.PI)*70*(e.ex<W/2?1:-1);e.y=e.ey+(ty-e.ey)*s}if(u>=1)e.enter=0;continue}
    if(e.mode==='form'){e.x=tx;e.y=ty}
    else if(e.mode==='dive'){const d=e.dv;d.t+=dt;e.y+=d.vy*dt;e.x+=(clamp(p.x-e.x,-1,1)*d.home+Math.sin(d.t*d.wf)*d.wa)*dt;e.x=clamp(e.x,16,W-16);
      if(e.y>H+40){e.mode='return';e.y=-40;e.x=tx}}
    else if(e.mode==='return'){e.x+=(tx-e.x)*Math.min(1,dt*3);e.y+=(ty-e.y)*Math.min(1,dt*3);if(Math.abs(e.y-ty)<2)e.mode='form'}
    // Darnold throws INTs
    if(e.k==='darnold'||(trackI>=2&&e.k==='caleb')){e.shotT-=dt;if(e.shotT<=0&&e.y>0&&e.y<H*0.6){e.shotT=rnd(2.4,4.5)/sp;const a=Math.atan2(p.y-e.y,p.x-e.x);const v=150*Math.min(1.6,sp);
      eshots.push({x:e.x,y:e.y+14,vx:Math.cos(a)*v,vy:Math.sin(a)*v,k:e.k==='darnold'?'int':'sack',r:0});if(e.k==='darnold'){if(R()<0.35)AUD.heckle('INT');AUD.SFX.intThrow()}}}
    // collisions w/ footballs
    for(const b of balls){if(b.hit)continue;if(Math.abs(b.x-e.x)<e.d.w/2+5&&Math.abs(b.y-e.y)<e.d.h/2+6){b.hit=1;e.hp--;e.fl=0.12;burst(b.x,b.y,5,0);
      if(e.k==='year4'&&!e.flipped){e.flipped=1;pop(e.x,e.y-26,'YEAR 5!',RED,12);if(R()<0.4)AUD.heckle('YEAR4')}
      if(e.hp<=0){killEnemy(e);break}else AUD.SFX.chomp()}}
    if(!e.dead&&Math.abs(e.x-p.x)<e.d.w/2+12&&Math.abs(e.y-p.y)<e.d.h/2+16){e.dead=1;burst(e.x,e.y,12,1);hurtPlayer(e.d.word[0])}
  }
  enemies=enemies.filter(e=>!e.dead);
  // dives
  diveT-=dt;if(diveT<=0&&enemies.length){diveT=rnd(1.2,2.6)/sp;const cand=enemies.filter(e=>e.mode==='form'&&!e.enter);if(cand.length){const e=pick(cand);e.mode='dive';
    const fast=e.k==='pick4'||e.k==='trade';e.dv={t:0,vy:(fast?190:140)*Math.min(1.8,sp),home:fast?40:80,wf:rnd(2,4),wa:e.k==='trade'?140:60}}}
  // balloon
  if(balloon){const b=balloon;b.t+=dt;b.x+=34*dt*Math.min(1.6,sp);b.y=140+Math.sin(b.t*1.3)*18;b.fl=Math.max(0,b.fl-dt);b.sc=1+(1-b.hp/b.max)*0.9;
    for(const bl of balls){if(bl.hit)continue;if(Math.hypot(bl.x-b.x,(bl.y-b.y)*0.8)<34*b.sc){bl.hit=1;b.hp--;b.fl=0.1;AUD.SFX.squeak(1-b.hp/b.max);burst(bl.x,bl.y,4,0);if(b.hp<=0){popBalloon();break}}}
    if(balloon&&balloon.x>W+120){balloon=null;pop(W-60,150,'THE REBUILD FLOATED AWAY... LIKE JOE\'S TITLE HOPES',RED,10)}}
  // boss
  if(boss)updBoss(dt,p);
  // enemy shots
  for(const s of eshots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.r+=dt*8;if(Math.hypot(s.x-p.x,s.y-p.y)<16){s.dead=1;hurtPlayer(s.k==='int'?'PICKED OFF!':s.k==='snot'?'SNOT BOMB!':s.k==='trade'?'TRADE OFFER TO THE FACE!':'SACKED!')}}
  eshots=eshots.filter(s=>!s.dead&&s.y<H+20&&s.y>-40&&s.x>-30&&s.x<W+30);
  // gold Brett stars (catch, don't shoot)
  starT-=dt;if(starT<=0){starT=rnd(8,12);spawnStar()}
  for(const s of stars){s.t+=dt;s.y+=s.vy*dt;s.x+=Math.sin(s.t*2)*20*dt;if(Math.hypot(s.x-p.x,s.y-p.y)<34){s.dead=1;catchStar(s)}}
  stars=stars.filter(s=>!s.dead&&s.y<H+30);
  for(const pt of potties)pt.t+=dt;potties=potties.filter(pt=>pt.t<2.2);
  // track clear
  if(!TRACKS[trackI].boss&&!trackCleared&&enemies.length===0&&trackT>2&&!balloon){trackCleared=true;score+=500*(trackI+1);showBanner('TRACK CLEARED! +'+500*(trackI+1),GOLD);AUD.SFX.bonus();AUD.SFX.cheer(1);
    setTimeout(()=>{if(state==='play')startTrack(trackI+1)},1800)}
  // ambient heckles
  nextAmb-=dt;if(nextAmb<=0){nextAmb=rnd(7,12);AUD.heckle(R()<0.18?'WILSON':R()<0.1?'CHANT':'ambient')}
}
function movePlayer(dt){const p=player;if(!p)return;const k=keys,v=300*dt;if(k.ArrowLeft||k.a)p.x-=v;if(k.ArrowRight||k.d)p.x+=v;if(k.ArrowUp||k.w)p.y-=v;if(k.ArrowDown||k.s)p.y+=v;p.x=clamp(p.x,18,W-18);p.y=clamp(p.y,H*0.45,H-44);p.bob+=dt}
function catchStar(s){const P=POW[s.type];AUD.SFX.power();AUD.SFX.bonus();score+=300;pop(s.x,s.y-20,P.l+'!',GOLD,15);burst(s.x,s.y,24,0);
  if(s.type==='spread')player.spreadT=10;else if(s.type==='rapid')player.rapidT=9;else if(s.type==='shield')player.shieldT=14;else lives=Math.min(5,lives+1);
  AUD.sting(P.k,{quiet:true,throttle:2500})||null;setTimeout(()=>{if(state==='play')AUD.heckle(R()<0.5?'WILSON':'STAR',true)},1500);showBanner(P.l+'!',GOLD)}
function updBoss(dt,p){const b=boss;b.t+=dt;b.fl=Math.max(0,b.fl-dt);
  if(b.dead){b.y+=dt*40;return}
  b.y+=(b.ty-b.y)*Math.min(1,dt*1.5);b.x+=b.dir*(50+70*(1-b.hp/b.max))*dt*Math.min(1.5,speed());if(b.x>W-70){b.x=W-70;b.dir=-1}if(b.x<70){b.x=70;b.dir=1}
  b.cry=1-b.hp/b.max;if(R()<dt*(4+b.cry*20))snot(b.x+rnd(-14,14),b.y+4);
  b.shotT-=dt;if(b.shotT<=0&&b.y>60){b.shotT=rnd(0.8,1.5)/Math.min(1.6,speed())*(1-b.cry*0.35);const r=R();
    if(r<0.45){for(let i=-1;i<=1;i++){const a=Math.atan2(p.y-b.y,p.x-b.x)+i*0.28;eshots.push({x:b.x,y:b.y+30,vx:Math.cos(a)*160,vy:Math.sin(a)*160,k:'int',r:0})}AUD.SFX.intThrow()}
    else if(r<0.75){eshots.push({x:b.x+rnd(-30,30),y:b.y+30,vx:rnd(-40,40),vy:130,k:'trade',r:0})}
    else{for(let i=0;i<5;i++)eshots.push({x:b.x+rnd(-12,12),y:b.y+10,vx:rnd(-90,90),vy:rnd(110,170),k:'snot',r:0});AUD.SFX.sniff()}}
  for(const bl of balls){if(bl.hit)continue;if(Math.abs(bl.x-b.x)<46&&Math.abs(bl.y-b.y)<60){bl.hit=1;b.hp--;b.fl=0.1;hits++;burst(bl.x,bl.y,6,R()<0.3?1:0);score+=40;
    if(b.hp%6===0){airhorn();AUD.SFX.bossHit();addCombo(5)}if(b.hp%9===0)AUD.heckle('BOSSHIT');if(b.hp<=0){killBoss();break}}}
  if(Math.abs(p.x-b.x)<50&&Math.abs(p.y-b.y)<60)hurtPlayer('JOE HUGGED YOU, CRYING')}
function updParts(dt){for(const q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=(q.tp===1?120:q.tp===2?160:300)*dt;q.vx*=(1-dt*(q.tp===1?1.6:1.2));q.rot+=q.vr*dt;q.life-=dt}parts=parts.filter(q=>q.life>0&&q.y<H+60);
  if(parts.length>700)parts.splice(0,parts.length-700);for(const q of pops){q.y-=30*dt;q.life-=dt}pops=pops.filter(q=>q.life>0)}
// ---------- drawing: sprites ----------
function football(x,y,r,s,col){ctx.save();ctx.translate(x,y);ctx.rotate(r);ctx.fillStyle=col||'#8b4513';ctx.beginPath();ctx.ellipse(0,0,s*1.5,s,0,0,7);ctx.fill();ctx.strokeStyle='#3a1a05';ctx.lineWidth=1;ctx.stroke();
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(1,s/4);ctx.beginPath();ctx.moveTo(-s*0.6,0);ctx.lineTo(s*0.6,0);ctx.stroke();for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*s*0.25,-s*0.3);ctx.lineTo(i*s*0.25,s*0.3);ctx.stroke()}ctx.restore()}
function crown(x,y,w){ctx.save();ctx.fillStyle=goldGrad(y-w*0.5,y);ctx.strokeStyle='#5a3a00';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x-w/2,y);ctx.lineTo(x-w/2,y-w*0.32);ctx.lineTo(x-w/4,y-w*0.16);ctx.lineTo(x,y-w*0.5);ctx.lineTo(x+w/4,y-w*0.16);ctx.lineTo(x+w/2,y-w*0.32);ctx.lineTo(x+w/2,y);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#e3262e';ctx.beginPath();ctx.arc(x,y-w*0.1,w*0.07,0,7);ctx.fill();ctx.fillStyle='#36e0ff';ctx.beginPath();ctx.arc(x-w*0.27,y-w*0.08,w*0.05,0,7);ctx.arc(x+w*0.27,y-w*0.08,w*0.05,0,7);ctx.fill();ctx.restore()}
function chain(x,y,w,t){ctx.save();ctx.strokeStyle=GOLD;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-w/2,y-w*0.15);ctx.quadraticCurveTo(x,y+w*0.45,x+w/2,y-w*0.15);ctx.stroke();ctx.strokeStyle='#a06a00';ctx.setLineDash([2,3]);ctx.lineWidth=1.5;ctx.stroke();ctx.setLineDash([]);
